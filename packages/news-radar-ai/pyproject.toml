[project]
name = "news-radar-ai"
version = "1.0.0"
description = "AI 资讯雷达：消费 newsbox 采集层 + DeepSeek 评分，产出 Obsidian Markdown AI 日报"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "a809384377" }]
license = { text = "MIT" }
keywords = ["ai", "news", "rss", "obsidian", "deepseek", "newsbox"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Text Processing :: Markup :: Markdown",
]
# This repository resolves newsbox from the local uv workspace.
dependencies = [
    "typer>=0.12",
    "loguru>=0.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "newsbox>=1.0.3",
    "httpx>=0.28.1",
    "ruamel-yaml>=0.18",
]

[project.scripts]
news-radar-ai = "news_radar_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_radar_ai"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv.sources]
newsbox = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
